name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------
  # Core library — minimal build (no external deps)
  # ------------------------------------------------------------------
  build-core:
    name: Build + Test (petgraph_backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --no-default-features --features "petgraph_backend"

      - name: Build (with tokio actors)
        run: cargo build --no-default-features --features "petgraph_backend,tokio"

      - name: Unit tests
        run: cargo test --no-default-features --features "petgraph_backend" --lib

      - name: Unit tests (with tokio actors)
        run: cargo test --no-default-features --features "petgraph_backend,tokio" --lib

      # `--lib` covers the crate's inline `#[cfg(test)]` modules only. tests/unit/
      # is a separate target (509 tests) and nothing ran it until this step
      # existed, so a file added there was never executed by CI.
      - name: Unit suite (tests/unit)
        run: cargo test --no-default-features --features "petgraph_backend" --test unit_suite

      - name: Unit suite (tests/unit, with tokio actors)
        run: cargo test --no-default-features --features "petgraph_backend,tokio" --test unit_suite

      - name: Integration tests
        run: cargo test --no-default-features --features "petgraph_backend" --test integration_suite

      - name: Integration tests (with tokio actors)
        run: cargo test --no-default-features --features "petgraph_backend,tokio" --test integration_suite

      - name: Property tests
        run: cargo test --no-default-features --features "petgraph_backend" --test property_suite

      - name: Property tests (with tokio actors)
        run: cargo test --no-default-features --features "petgraph_backend,tokio" --test property_suite

      - name: Clippy
        # -D warnings removed: pre-existing unused-import/dead-code warnings are tracked separately
        run: cargo clippy --no-default-features --features "petgraph_backend" -- -D clippy::correctness

      - name: Clippy (with tokio actors)
        run: cargo clippy --no-default-features --features "petgraph_backend,tokio" -- -D clippy::correctness

      - name: Rustfmt
        continue-on-error: true  # pre-existing formatting issues in benches/ tracked separately
        run: cargo fmt --all -- --check

  # ------------------------------------------------------------------
  # Web server build
  # ------------------------------------------------------------------
  build-web:
    name: Build (web-server,petgraph_backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-web-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-web-

      - name: Build web-server binary
        run: cargo build --release --bin webserver --no-default-features --features "web-server,petgraph_backend"

  # ------------------------------------------------------------------
  # Web server test surface
  #
  # `web-server` gates 127 integration tests (182 -> 309). build-web only
  # compiles the binary, so until this job existed those 127 were written but
  # never executed in CI — which is how a record_type mismatch on /memory/query
  # reached main with a green pipeline.
  #
  # One more web-gated suite is not reachable through `--test integration_suite`:
  # `v040_contract_sit` is declared as its own `[[test]]` target with
  # `required-features = ["web-server"]`, because 77b418b moved it out of the
  # integration registrar to avoid an `intelligence_sit` compile error. Every step
  # here names its target explicitly, so a target nobody names is a target nothing
  # runs — its 6 contract tests sat red and silent while the pipeline stayed green.
  # It is named below.
  #
  # Features are additive, so the same suites are re-run with the feature on:
  # a target that passes minimally can still fail once web-server is compiled
  # in, and the property suite is where the graph/FSM invariants live.
  # ------------------------------------------------------------------
  web-tests:
    name: Test (web-server,petgraph_backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-web-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-web-

      - name: Unit suite
        run: cargo test --no-default-features --features "web-server,petgraph_backend" --test unit_suite

      - name: Integration suite
        # These bind a real TCP listener on an ephemeral port and drive it with
        # reqwest, so the routes and their handlers are exercised end to end.
        run: cargo test --no-default-features --features "web-server,petgraph_backend" --test integration_suite

      - name: Contract suite (standalone target)
        # Kept as its own target rather than folded back into `integration_suite`:
        # 77b418b split it out deliberately, and naming it here closes the real gap
        # without reverting that decision. Today it is green; the point is that it
        # runs, so a future drift cannot hide the way bc5d6f7's did.
        run: cargo test --no-default-features --features "web-server,petgraph_backend" --test v040_contract_sit

      - name: Property suite
        run: cargo test --no-default-features --features "web-server,petgraph_backend" --test property_suite

      - name: Clippy
        run: cargo clippy --no-default-features --features "web-server,petgraph_backend" -- -D clippy::correctness

  # ------------------------------------------------------------------
  # Latency benchmark — runs on PRs, posts results as comment
  # ------------------------------------------------------------------
  benchmark:
    name: Latency Benchmark
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-web-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-web-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests tabulate

      - name: Build + start server
        run: |
          cargo build --release --bin webserver \
            --no-default-features --features "web-server,petgraph_backend"
          mkdir -p /tmp/hipcortex_bench
          PORT=3030 DATA_DIR=/tmp/hipcortex_bench \
            ./target/release/webserver &
          sleep 3

      - name: Run benchmark
        run: |
          python benchmarks/python_benchmark.py \
            --url http://localhost:3030 -n 50 --no-baseline \
            | tee benchmark_results.txt

      - name: Run token reduction benchmark (proactive harness; in-process sim but in live-server-provisioned job per spec 4.1; asserts 80%+)
        run: python benchmarks/token_reduction_benchmark.py
        env:
          PYTHONPATH: ${{ github.workspace }}/sdk/python

      - name: Post benchmark comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('benchmark_results.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚡ Benchmark Results\n\`\`\`\n${results}\n\`\`\``
            });

  # ------------------------------------------------------------------
  # Python SDK unit tests (no server required — mocked)
  # ------------------------------------------------------------------
  python-sdk:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK + test deps
        run: |
          pip install -e "sdk/python[test]"
          pip install requests "langchain-core>=0.1,<0.3" "langchain>=0.1,<0.3"

      - name: Run unit tests (no server needed)
        run: pytest sdk/python/langchain_contrib/test_hipcortex_memory.py -v -k "not integration"
        env:
          PYTHONPATH: ${{ github.workspace }}/sdk/python

      # The step above covers 6 tests. sdk/python/tests/ holds 242 — the passive
      # observers, the MCP server contract, config and CLI behaviour — and none
      # of it ran in CI. The whole directory is ~6s and needs no server, so there
      # is no reason to keep it out of the pipeline.
      - name: Run SDK test suite
        run: pytest sdk/python/tests/ -q
        env:
          PYTHONPATH: ${{ github.workspace }}/sdk/python

  # ------------------------------------------------------------------
  # Host MCP install E2E smoke — pure filesystem, no live hosts
  # Antigravity / Hermes / OpenClaw / Grok installers + unit coverage
  # ------------------------------------------------------------------
  host-install-e2e:
    name: Host install E2E smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package editable
        run: pip install -e "sdk/python[test]"

      - name: Host installer smoke
        run: >
          pytest
          sdk/python/tests/test_host_install_e2e.py
          sdk/python/tests/test_cli_install.py
          -k "antigravity or hermes or openclaw or grok"
          -q --tb=line

  # ------------------------------------------------------------------
  # Token reduction benchmark (proactive harness) — always runs, in-process sim
  # Validates 80%+ reduction per validation-benchmarks spec + agent-substrate plan follow-on.
  # ------------------------------------------------------------------
  token-reduction:
    name: Token Reduction Benchmark (Proactive Harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run proactive token reduction benchmark (asserts >=80% savings)
        run: python benchmarks/token_reduction_benchmark.py
