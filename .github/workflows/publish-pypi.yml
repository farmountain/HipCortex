name: Publish Python SDK to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:    # manual trigger for testing

jobs:
  publish:
    name: Build + publish hipcortex to PyPI
    runs-on: ubuntu-latest
    # Remove 'environment: pypi' if using API token approach
    # environment: pypi
    permissions:
      id-token: write  # needed only for OIDC trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel + sdist
        working-directory: sdk/python
        run: python -m build

      # Option A: API token (add PYPI_API_TOKEN secret to repo settings)
      - name: Publish to PyPI (API token)
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      # Option B: OIDC trusted publishing (requires pypi.org trusted publisher setup)
      # Uncomment and remove Option A once trusted publisher is configured:
      # - name: Publish to PyPI (OIDC)
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: sdk/python/dist/
