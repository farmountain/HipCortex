name: Publish Python SDK to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:    # manual trigger for testing

jobs:
  publish:
    name: Build + publish hipcortex to PyPI
    runs-on: ubuntu-latest
    # Remove 'environment: pypi' if using API token approach
    # environment: pypi
    permissions:
      id-token: write  # needed only for OIDC trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel + sdist
        working-directory: sdk/python
        run: python -m build

      # Publish to PyPI — requires PYPI_API_TOKEN secret or OIDC trusted publisher setup.
      # On release: publishes. On workflow_dispatch: builds but skips publish (continue-on-error).
      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
