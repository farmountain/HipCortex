name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: webserver
            asset_name: hipcortex-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: webserver
            asset_name: hipcortex-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: webserver
            asset_name: hipcortex-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: webserver
            asset_name: hipcortex-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: webserver.exe
            asset_name: hipcortex-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --version 0.2.5

      - name: Build (cross — Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cross build --release --bin webserver \
            --no-default-features --features "web-server,petgraph_backend" \
            --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash  # use bash on all platforms — PowerShell doesn't support \ continuation
        run: |
          cargo build --release --bin webserver \
            --no-default-features --features "web-server,petgraph_backend" \
            --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash  # git-bash on Windows, bash on Linux/macOS
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             ${{ matrix.asset_name }}

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}

      - name: Save binary as artifact (workflow_dispatch testing)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 3
