[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hipcortex"
version = "0.2.0"
description = "Persistent causal memory for AI agents — LangChain, LlamaIndex, AutoGen, CrewAI"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "HipCortex Contributors"}]
keywords = ["ai", "memory", "langchain", "autogen", "crewai", "llm", "agents", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
dependencies = ["requests>=2.28", "httpx>=0.27"]

[project.optional-dependencies]
langchain   = ["langchain-core>=0.1"]
llamaindex  = ["llama-index-core>=0.10"]
crewai      = ["crewai>=0.28", "crewai-tools>=0.1"]
autogen     = ["pyautogen>=0.2"]
benchmark   = ["mem0ai>=0.1", "tabulate>=0.9"]
all         = ["langchain-core>=0.1", "llama-index-core>=0.10",
               "crewai>=0.28", "crewai-tools>=0.1",
               "pyautogen>=0.2", "mem0ai>=0.1", "tabulate>=0.9"]

[project.urls]
Homepage   = "https://github.com/farmountain/HipCortex"
Repository = "https://github.com/farmountain/HipCortex"
Issues     = "https://github.com/farmountain/HipCortex/issues"
Benchmark  = "https://github.com/farmountain/HipCortex/blob/main/BENCHMARK.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["hipcortex*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
