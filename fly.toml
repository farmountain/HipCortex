# fly.toml app configuration file generated for hipcortex on 2026-05-20T20:33:30+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hipcortex'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG  = "info"
  DATA_DIR  = "/app/data"

[mounts]
  source      = "hipcortex_data"
  destination = "/app/data"

[http_service]
  internal_port = 3030
  force_https   = true
  auto_stop_machines  = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval     = "15s"
    method       = "get"
    path         = "/health"
    protocol     = "http"
    timeout      = "5s"

[[vm]]
  memory   = '512mb'
  cpu_kind = 'shared'
  cpus     = 1
