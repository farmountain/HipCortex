[pytest]
testpaths = tests/e2e_user_harness
pythonpath = .
markers =
    core: Core phase bootstrap and memory operations tests
    worldmodel: Phase 2 and Phase 8 cognitive and token optimization tests
    integration: Phase 3 framework integration tests
    vscode: Phase 4 VS Code extension and IDE workflows tests
    persistence: Phase 5 Merkle chain and audit log persistence tests
    perf: Phase 6 sub-millisecond local latency and scalability tests
